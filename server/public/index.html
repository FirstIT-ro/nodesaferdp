<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machines · NodeSafeRDP</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <h1>NodeSafeRDP · Machines</h1>
  <span class="muted" id="who"></span>
  <span class="muted" id="expiry"></span>
  <button id="logout">Sign out</button>
</header>
<main class="dash">
  <p class="muted" id="summary">Loading…</p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Machine</th><th>Status</th><th>Windows user</th><th>Connection</th><th>Viewers</th><th>Last seen</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No machines have connected yet. Start the Windows agent to see it here.</div>
  </div>
</main>
<script src="/static/dashboard.js"></script>
</body>
</html>
